[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the fuzzer out of the `pmtiles` build and package
[workspace]

[lib]
name = "pmtiles_fuzz"
path = "src/lib.rs"

[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "directory"
path = "fuzz_targets/directory.rs"
test = false
doc = false
bench = false

[dependencies]
bytes = "1"
futures-executor = "0.3"
futures-util = "0.3"
libfuzzer-sys = "0.4"
pmtiles = { path = "..", default-features = false, features = ["brotli", "iter-async", "tilejson", "zstd"] }

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
